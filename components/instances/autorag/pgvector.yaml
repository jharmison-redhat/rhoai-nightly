apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgvector-data
  namespace: autorag-tenant
  labels:
    app: pgvector
    purpose: autorag
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pgvector
  namespace: autorag-tenant
  labels:
    app: pgvector
    purpose: autorag
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: pgvector
  ports:
    - port: 5432
      targetPort: 5432
---
# pgvector Deployment mirrors the MaaS PostgreSQL pattern
# (components/instances/maas-instance/chart/templates/postgres-*.yaml):
# single replica, Recreate strategy, PVC subPath-style data dir, probes,
# 512Mi/1Gi. Image differs because the pgvector extension is required
# (registry.redhat.io/rhel9/postgresql-16 does not ship it) — so the
# official-image conventions apply: POSTGRES_* env names map directly from
# the secret, and initdb scripts run from /docker-entrypoint-initdb.d
# (see pgvector-init.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector
  namespace: autorag-tenant
  labels:
    app: pgvector
    purpose: autorag
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgvector
  template:
    metadata:
      labels:
        app: pgvector
    spec:
      containers:
        - name: pgvector
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: autorag-pg-creds
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: autorag-pg-creds
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: autorag-pg-creds
                  key: POSTGRES_DB
            # Subdirectory under the mounted PVC avoids lost+found on some
            # CSI drivers breaking postgres init (official-image pattern).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pgvector-data
        - name: init
          configMap:
            name: pgvector-init
