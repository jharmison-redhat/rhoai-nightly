apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: ${MAAS_EXTERNAL_NAME}-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "${MAAS_EXTERNAL_MODEL} Access"
    openshift.io/description: "Grants all authenticated users access to external model ${MAAS_EXTERNAL_MODEL}"
spec:
  modelRefs:
    - name: ${MAAS_EXTERNAL_NAME}
      namespace: llm
  subjects:
    groups:
      - name: system:authenticated
    users: []
