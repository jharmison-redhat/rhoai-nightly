apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: rhoai-cpu
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
      flavors:
        - name: default
          resources:
            - name: cpu
              nominalQuota: 48
            - name: memory
              nominalQuota: 192Gi
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: rhoai-gpu
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
      flavors:
        - name: default
          resources:
            - name: cpu
              nominalQuota: 24
            - name: memory
              nominalQuota: 96Gi
    - coveredResources:
        - nvidia.com/gpu
      flavors:
        - name: l40s
          resources:
            - name: nvidia.com/gpu
              nominalQuota: 3
