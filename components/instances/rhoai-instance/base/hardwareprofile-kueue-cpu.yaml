apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    opendatahub.io/dashboard-feature-visibility: '[]'
    opendatahub.io/description: CPU profile scheduled via Kueue (LocalQueue default in the llm namespace).
    opendatahub.io/disabled: 'false'
    opendatahub.io/display-name: CPU Profile (Kueue)
  labels:
    app.kubernetes.io/part-of: hardwareprofile
    app.opendatahub.io/hardwareprofile: "true"
  name: kueue-cpu
  namespace: redhat-ods-applications
spec:
  identifiers:
    - defaultCount: '2'
      displayName: CPU
      identifier: cpu
      minCount: 1
      resourceType: CPU
    - defaultCount: 8Gi
      displayName: Memory
      identifier: memory
      minCount: 1Gi
      resourceType: Memory
  scheduling:
    type: Queue
    kueue:
      localQueueName: default
