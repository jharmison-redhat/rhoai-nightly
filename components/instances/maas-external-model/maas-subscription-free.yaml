apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: ${MAAS_EXTERNAL_NAME}-free
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "${MAAS_EXTERNAL_MODEL} Free Tier"
    openshift.io/description: "Free tier: 100 tokens/min for all authenticated users"
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: ${MAAS_EXTERNAL_NAME}
      namespace: llm
      tokenRateLimits:
        - limit: 100
          window: 1m
  priority: 10
