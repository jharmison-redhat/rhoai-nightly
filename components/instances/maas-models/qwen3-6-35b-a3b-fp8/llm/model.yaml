# Red Hat AI Qwen3.6-35B-A3B FP8 (dynamic) on vLLM CUDA
# Model weights: OCI modelcar from registry.redhat.io (~40GB download)
# Runtime: Red Hat AI Inference Server (vLLM CUDA)
# Requires: one L40S-class GPU with 48GB GPU memory
# Hybrid gated-delta-net MoE (35B total / 3B active); recipe:
# https://github.com/vllm-project/recipes/blob/main/Qwen/Qwen3.5.md
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen3-6-35b-a3b-fp8
  annotations:
    openshift.io/display-name: "Red Hat AI Qwen3.6-35B-A3B FP8"
    opendatahub.io/model-type: generative
    opendatahub.io/hardware-profile-name: kueue-gpu
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    security.opendatahub.io/enable-auth: "true"
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
spec:
  model:
    name: qwen3-6-35b-a3b-fp8
    uri: oci://registry.redhat.io/rhai/modelcar-redhatai-qwen3-6-35b-a3b-fp8-dynamic:latest
  replicas: 1
  router:
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
    containers:
      - name: main
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.1
        command:
          - python
          - -m
          - vllm.entrypoints.openai.api_server
        args:
          - "--served-model-name={{.Name}}"
          - --model=/mnt/models
          - --enable-ssl-refresh
          - --ssl-certfile=/var/run/kserve/tls/tls.crt
          - --ssl-keyfile=/var/run/kserve/tls/tls.key
          - --enable-force-include-usage
          - --max-model-len=32768
          - --reasoning-parser=qwen3
          - --enable-auto-tool-choice
          - --tool-call-parser=qwen3_coder
          - --enable-prefix-caching
          - --language-model-only
          - --gpu-memory-utilization=0.95
          - --kv-cache-dtype=fp8
          - --max-num-seqs=4
          - --max-num-batched-tokens=4096
          - --max-cudagraph-capture-size=32
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 600
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 600
          periodSeconds: 15
          timeoutSeconds: 15
          failureThreshold: 30
        resources:
          requests:
            cpu: "2"
            memory: 16Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: 60Gi
            nvidia.com/gpu: "1"
        volumeMounts:
          - mountPath: /dev/shm
            name: shm
    volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
