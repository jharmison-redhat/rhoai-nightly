apiVersion: datasciencepipelinesapplications.opendatahub.io/v1
kind: DataSciencePipelinesApplication
metadata:
  name: dspa
  namespace: autorag-tenant
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  dspVersion: v2
  podToPodTLS: false
  objectStorage:
    disableHealthCheck: false
    enableExternalRoute: true
    minio:
      deploy: true
      image: quay.io/opendatahub/minio:RELEASE.2019-08-14T20-37-41Z-license-compliance
  apiServer:
    # Enable AutoML and AutoRAG pipelines: the "Enable AutoML and AutoRAG
    # pipelines" checkbox in the dashboard pipeline-server Advanced settings.
    # NOTE (docs drift): the 3.5 docs say set `managedPipelines: {}`, but on
    # the 3.5 nightly the DSPO reports ManagedPipelineValid=False with
    # "Managed pipelines not configured or no explicit pipeline list" unless
    # the pipelines are listed explicitly. The init container
    # (init-managed-pipelines) compiles exactly these four from the
    # pipelines-components image; ManagedPipelineValid=True confirms it.
    managedPipelines:
      pipelines:
        - name: documents-indexing-pipeline
        - name: autogluon-tabular-training-pipeline
        - name: autogluon-timeseries-training-pipeline
        - name: documents-rag-optimization-pipeline
