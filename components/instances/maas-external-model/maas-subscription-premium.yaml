apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: ${MAAS_EXTERNAL_NAME}-premium
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "${MAAS_EXTERNAL_MODEL} Premium Tier"
    openshift.io/description: "Premium tier: 10000 tokens/min for all authenticated users"
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: ${MAAS_EXTERNAL_NAME}
      namespace: llm
      tokenRateLimits:
        - limit: 100000
          window: 1m
  priority: 20
